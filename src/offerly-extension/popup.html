
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
  <title>Offerly</title>
</head>
<body>
  <main class="popup">
    <div class="brand">
      <img src="offerly.png" alt="" class="logo" />
      <div>
        <h2>Offerly</h2>
        <p>Your job search companion</p>
      </div>
    </div>

    <section id="loginView">
      <h3>Connect your account</h3>
      <input id="emailInput" type="email" placeholder="Email" />
      <input id="passwordInput" type="password" placeholder="Password" />
      <button id="loginBtn" type="button">Log in</button>
      <p id="loginStatus" role="status"></p>
    </section>

    <section id="saveView" class="hidden">
      <div class="job-card">
        <div class="job-card-heading">
          <span>Detected job</span>
          <span id="saveBadge" class="save-badge">Checking...</span>
        </div>

        <label for="company">Company</label>
        <input id="company" placeholder="Detecting company..." />

        <label for="role">Job title</label>
        <input id="role" placeholder="Detecting role..." />

        <label for="location">Location</label>
        <input id="location" placeholder="Detecting location..." />

        <a
          id="jobLink"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          class="job-link hidden"
        >
          View job posting ↗
        </a>
      </div>

      <div class="autofill-card">
        <h3>Ready to apply?</h3>
        <p>
          Would you like Offerly to autofill this application
          using your saved profile?
        </p>

        <button id="autofillBtn" type="button">
          ✨ Yes, Autofill Application
        </button>

        <button id="notNowBtn" type="button" class="secondary-btn">
          Not now
        </button>
      </div>

      <p id="status" role="status"></p>

      <button id="logoutBtn" type="button" class="secondary-btn">
        Disconnect
      </button>
    </section>
  </main>
  <script src="popup.js"></script>
<script src="dropdownDriver.js"></script>

<script src="smartAnswers.js"></script>
<script src="aiAgent.js"></script>
<script src="profileAutofill.js"></script>

</body>
</html>
